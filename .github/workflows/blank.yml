name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p temp_extract
          unzip -o sms-forwarder-github.zip -d temp_extract
          TARGET_DIR=$(find temp_extract -name "package.json" -exec dirname {} \; | head -n 1)
          echo "Found project root in: $TARGET_DIR"
          cp -r "$TARGET_DIR"/* .
          rm -rf temp_extract

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sanitize Dependencies & Fix Autolinking
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("package.json")) process.exit(0);
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const clean = (deps) => {
              if (!deps) return;
              for (const k of Object.keys(deps)) {
                if (k.startsWith("@workspace/") || String(deps[k]).includes("workspace:")) {
                  delete deps[k];
                } else if (String(deps[k]).startsWith("catalog:")) {
                  deps[k] = "*";
                }
              }
            };
            clean(pkg.dependencies);
            clean(pkg.devDependencies);
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          grep -rl "@workspace/" . --exclude-dir={.git,.github,node_modules} 2>/dev/null | xargs -r sed -i 's|@workspace/[^"\x27]*|react|g' || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g expo-cli

      - name: Run Autolinking Diagnostics & Prebuild
        run: |
          npx expo-modules-autolinking resolve -p android || true
          CI=1 npx expo prebuild --platform android --clean --no-install

      - name: Build Android Release APK
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "reactNativeArchitectures=arm64-v8a" >> gradle.properties
          echo "newArchEnabled=false" >> gradle.properties
          echo "expo.useLegacyAutolinking=true" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -x lint -x test --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-app
          path: android/app/build/outputs/apk/release/*.apk
